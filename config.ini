[run]
# Relative paths are resolved from this gpu_utilizer directory.
layer_csv = examples/layers_example.csv
output_csv = Results/gpu_profile_results.csv
normalized_csv = Results/normalized_layers.csv

device = cuda:0
gpu_index = 0
dtype = float32
warmup = 20
repeat = 100

# Paper-friendly defaults.
require_idle_gpu = true
allow_nvidia_smi_fallback = false
allow_zero_energy_estimate = true
stop_on_error = true
cudnn_benchmark = true
