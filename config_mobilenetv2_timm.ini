[run]
layer_csv = examples/mobilenetv2_100_bs1_layers.csv
output_csv = Results/mobilenetv2_100_bs1_timm_profile.csv
normalized_csv = Results/mobilenetv2_100_bs1_timm_normalized.csv

device = cuda:0
gpu_index = 0
dtype = float32
warmup = 5
repeat = 20

require_idle_gpu = true
allow_nvidia_smi_fallback = false
allow_zero_energy_estimate = true
stop_on_error = true
cudnn_benchmark = true
